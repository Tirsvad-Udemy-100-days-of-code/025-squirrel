# yamllint configuration for the workflow files in .gitea/workflows/.
extends: default
rules:
  document-start: disable
  line-length:
    max: 100
  truthy:
    check-keys: false
  # Line endings are normalised by git (LF in the repository, CRLF in some
  # Windows checkouts), so the rule would fail on a local checkout only.
  new-lines: disable
